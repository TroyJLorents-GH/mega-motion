<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<meta name="description" content="">
<link rel="icon" href="data:,">
<!-- Brand threshold, first paint: read content.json's palette before anything draws (one small synchronous read, so
     the first frame is already this brand's colour, never the template's), then cover the page in the accent (never
     with ?capture). main.js reuses the parsed content. The cover lifts itself after 6 s if main.js never runs. -->
<script>(function(){var d=document.documentElement;try{var x=new XMLHttpRequest();x.open('GET','content.json',false);x.send();var c=JSON.parse(x.responseText);window.__content=c;var p=c.palette||{};for(var k in p)d.style.setProperty('--'+k,p[k]);}catch(e){}if(/[?&]capture(=|&|$)/.test(location.search))return;d.classList.add('th-on');window.__thFailsafe=setTimeout(function(){d.classList.remove('th-on')},6000);})();</script>
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{"imports": {"three": "./node_modules/three/build/three.module.js", "three/": "./node_modules/three/", "gsap": "./node_modules/gsap/index.js", "gsap/": "./node_modules/gsap/", "lenis": "./node_modules/lenis/dist/lenis.mjs"}}
</script>
<script type="module" src="main.js"></script>
</head>
<!-- Structure only: every word, link and colour comes from content.json (data-c = text path, data-href = link path,
     data-aria = aria-label path; links written "@works" or "@home" resolve to the page files named in content.json).
     Motion lives in main.js and motion/; timings in tokens.js; drawings in art/. -->
<body data-page="home">
<div class="threshold" aria-hidden="true">
  <svg class="th-svg" width="100%" height="100%">
    <defs><mask id="th-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><rect width="100%" height="100%" fill="#fff"/><path class="th-hole" fill="#000"/></mask></defs>
    <rect class="th-ground" width="100%" height="100%" mask="url(#th-mask)"/>
    <path class="th-slab"/>
    <path class="th-badge"/>
  </svg>
</div>
<a class="skip" href="#main" data-c="nav.skip"></a>

<header class="nav" data-theme="dark">
  <a class="nav-mark" href="index.html" data-aria="nav.homeLabel"><svg data-mark-svg aria-hidden="true"><path data-mark/></svg></a>
  <nav class="nav-links" data-aria="nav.primaryLabel"></nav>
  <a class="btn btn-small btn-ghost nav-cta" href="#contact" data-roll data-c="nav.contact"></a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu"><span class="menu-btn-label" data-c="nav.menu"></span><span class="menu-btn-icon" aria-hidden="true"><i></i><i></i></span></button>
</header>

<div class="menu" id="menu" hidden>
  <div class="menu-scrim"></div>
  <div class="menu-panel" role="dialog" aria-modal="true" data-aria="menu.label">
    <ul class="menu-links"></ul>
    <div class="menu-meta"><p class="mono" data-c="menu.note"></p><a class="mono menu-email" data-c="menu.email"></a></div>
    <svg class="menu-curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path/></svg>
  </div>
</div>

<main id="main">
  <!-- 1. Hero: a CSS-sticky 1 vh inside a 2 vh track. The 3D view shrinks from full bleed to a card. -->
  <section class="hero" id="top">
    <div class="hero-sticky" data-sticky>
      <div class="hero-frame">
        <canvas class="hero-canvas" role="img" data-aria="home.hero.canvasLabel"></canvas>
        <canvas class="hero-fallback topo" aria-hidden="true"></canvas>
      </div>
      <div class="hero-top">
        <p class="eyebrow" data-wipe data-c="home.hero.eyebrow"></p>
        <p class="mono hero-coords" data-c="home.hero.coords"></p>
      </div>
      <h1 class="hero-name" data-wipe data-c="home.hero.name"></h1>
    </div>
  </section>

  <!-- 2. About: sticky for half a viewport, so the bio holds still while it is read (data-read). -->
  <section class="about" id="about" data-theme="dark">
    <div class="about-sticky" data-sticky>
      <canvas class="topo about-topo" aria-hidden="true"></canvas>
      <div class="about-grid">
        <div class="about-head">
          <p class="eyebrow" data-wipe data-c="home.about.eyebrow"></p>
          <h2 class="h2" data-wipe data-c="home.about.heading"></h2>
        </div>
        <div class="about-body">
          <p class="lede about-lede" data-c="home.about.body"></p>
          <dl class="facts"></dl>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Numbers: final values, revealed by the house wipe. -->
  <section class="stats" data-theme="dark">
    <p class="eyebrow" data-wipe data-c="home.stats.eyebrow"></p>
    <ul class="stats-row"></ul>
  </section>

  <!-- 4. Quote: line wipes in the accent. -->
  <section class="quote" data-theme="dark">
    <blockquote>
      <p class="quote-text" data-wipe data-c="home.quote.text"></p>
      <footer class="mono quote-by"><span data-c="home.quote.by"></span><span aria-hidden="true"> · </span><span data-c="home.quote.where"></span></footer>
    </blockquote>
  </section>

  <!-- 5. Gallery: CSS-sticky pin; cards travel 1 px across per 1 px scrolled; ground shifts to bone. -->
  <section class="gallery" id="works" aria-labelledby="gallery-title">
    <div class="gallery-sticky" data-sticky>
      <div class="gallery-bg" aria-hidden="true"></div>
      <div class="gallery-head">
        <div>
          <p class="eyebrow" data-wipe data-c="home.gallery.eyebrow"></p>
          <h2 class="h2 gallery-title" id="gallery-title" data-wipe data-c="home.gallery.heading"></h2>
        </div>
        <div class="gallery-progress mono" aria-hidden="true"><span class="gp-n">01</span><span class="gp-bar"><i></i></span><span class="gp-total">06</span></div>
      </div>
      <ol class="gallery-rail"></ol>
    </div>
  </section>

  <!-- 6. Contact, on bone. -->
  <section class="contact on-light" id="contact" data-theme="light">
    <canvas class="topo contact-topo" aria-hidden="true"></canvas>
    <p class="eyebrow" data-wipe data-c="home.contact.eyebrow"></p>
    <h2 class="contact-title" data-wipe data-c="home.contact.heading"></h2>
    <p class="lede" data-c="home.contact.body"></p>
    <div class="actions">
      <a class="btn btn-primary" data-roll data-href="home.contact.primary.href" data-c="home.contact.primary.label"></a>
      <a class="btn btn-ghost" data-roll data-href="home.contact.secondary.href" data-c="home.contact.secondary.label"></a>
    </div>
  </section>
</main>

<footer class="foot on-light" data-theme="light">
  <svg class="foot-mark" data-mark-svg aria-hidden="true"><path data-mark/></svg>
  <p class="foot-note" data-c="footer.note"></p>
  <p class="mono" data-c="footer.copy"></p>
  <a class="mono foot-top" href="#top" data-c="footer.top"></a>
</footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climbs</title>
<meta name="description" content="">

<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/800.css">

<link rel="stylesheet" href="styles.css">

{"imports": {"three": "./node_modules/three/build/three.module.js", "gsap": "./node_modules/gsap/index.js", "gsap/": "./node_modules/gsap/", "lenis": "./node_modules/lenis/dist/lenis.mjs"}}
</script>
<script type="module" src="main.js"></script>
</head>
<body data-page="climbs">
<div class="threshold" aria-hidden="true">
  <svg class="th-svg" width="100%" height="100%">
    <defs><mask id="th-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><rect width="100%" height="100%" fill="#fff"/><path class="th-hole" fill="#000"/></mask></defs>
    <rect class="th-ground" width="100%" height="100%" mask="url(#th-mask)"/>
    <path class="th-slab"/>
    <path class="th-badge"/>
  </svg>
</div>
<a class="skip" href="#main" data-c="nav.skip"></a>

<header class="nav" data-theme="dark">
  <a class="nav-mark" href="index.html" data-aria="nav.homeLabel"><svg data-mark-svg aria-hidden="true"><path data-mark/></svg></a>
  <nav class="nav-links" aria-label="Primary">
    <a class="nav-link" href="index.html" data-c="nav.home"></a>
    <a class="nav-link" href="climbs.html" data-c="nav.climbs"></a>
  </nav>
  <a class="btn btn-small btn-ghost nav-cta" data-roll data-href="nav.contactHref" data-c="nav.contact"></a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu"><span class="menu-btn-label" data-c="nav.menu"></span><span class="menu-btn-icon" aria-hidden="true"><i></i><i></i></span></button>
</header>

<div class="menu" id="menu" hidden>
  <div class="menu-scrim"></div>
  <div class="menu-panel" role="dialog" aria-modal="true" data-aria="menu.label">
    <ul class="menu-links"></ul>
    <div class="menu-meta"><p class="mono" data-c="menu.note"></p><a class="mono menu-email" data-c="menu.email"></a></div>
    <svg class="menu-curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path/></svg>
  </div>
</div>

<main id="main">
  <section class="index-hero" id="top" data-theme="dark">
    <canvas class="topo index-topo" aria-hidden="true"></canvas>
    <p class="eyebrow" data-wipe data-c="climbsPage.eyebrow"></p>
    <h1 class="index-title" data-wipe data-c="climbsPage.heading"></h1>
    <p class="lede" data-c="climbsPage.intro"></p>
  </section>

  <section class="index-list" data-theme="dark" aria-labelledby="index-route-col">
    <div class="index-cols mono">
      <span data-wipe data-c="climbsPage.columns.no"></span>
      <span></span>
      <span id="index-route-col" data-wipe data-c="climbsPage.columns.route"></span>
      <span class="col-d" data-wipe data-c="climbsPage.columns.grade"></span>
      <span class="col-d" data-wipe data-c="climbsPage.columns.crag"></span>
      <span class="col-d" data-wipe data-c="climbsPage.columns.year"></span>
    </div>
    <ol class="rows"></ol>
  </section>

  <section class="index-outro" data-theme="dark">
    <p class="eyebrow" data-wipe data-c="climbsPage.outro.eyebrow"></p>
    <h2 class="h2" data-wipe data-c="climbsPage.outro.heading"></h2>
    <div class="actions">
      <a class="btn btn-primary" data-roll data-href="climbsPage.outro.home.href" data-c="climbsPage.outro.home.label"></a>
      <a class="btn btn-ghost" data-roll data-href="climbsPage.outro.contact.href" data-c="climbsPage.outro.contact.label"></a>
    </div>
  </section>
</main>

<footer class="foot" data-theme="dark">
  <svg class="foot-mark" data-mark-svg aria-hidden="true"><path data-mark/></svg>
  <p class="foot-note" data-c="footer.note"></p>
  <p class="mono" data-c="footer.copy"></p>
  <a class="mono foot-top" href="#top" data-c="footer.top"></a>
</footer>
</body>
</html>
